<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma G*mes Static</title>
    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="https://sigma-sigma-rizz.vercel.app/favicon.svg" />
    <script>
      const savedIcon = localStorage.getItem('app-cloaking-icon');
      if (savedIcon) {
        document.getElementById('dynamic-favicon').href = savedIcon;
        document.getElementById('dynamic-favicon').type = 'image/png';
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #d4d4d8;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        /* Dark Glowy Theme */
        .glow-border {
            border: 1px solid rgba(39, 39, 42, 0.5);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .glow-border:hover {
            border-color: rgba(63, 63, 70, 0.8);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05), inset 0 0 30px rgba(255, 255, 255, 0.02);
            transform: translateY(-2px);
        }
        .matrix-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), 
                        radial-gradient(circle at center, rgba(10,10,12,1) 0%, rgba(0,0,0,1) 100%);
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
            filter: brightness(0.8) contrast(1.2);
            transition: all 0.3s;
        }
        .glow-border:hover .card-img {
            filter: brightness(1) contrast(1);
            transform: scale(1.05);
        }
        #player-overlay {
            display: none;
        }
        #player-overlay.active {
            display: flex;
        }

        /* Lumin overrides */
        #lumin-container {
            --lumin-bg: transparent !important;
            --lumin-surface: #18181b !important;
            --lumin-surface-hover: #27272a !important;
            --lumin-border: #27272a !important;
            --lumin-text: #ffffff !important;
        }
    </style>
</head>
<body class="antialiased">
    <div class="matrix-bg"></div>

    <div class="max-w-7xl mx-auto px-4 py-8 relative z-10">
        <header class="flex flex-col sm:flex-row items-center justify-between mb-8 pb-4 border-b border-zinc-800">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight flex items-center gap-3">
                    <i data-lucide="globe" class="text-zinc-400"></i>
                    Sigma G*mes Static
                </h1>
                <p class="text-zinc-500 mt-1 text-sm">Play g*mes from GN-Math, UGS, Seraph, Noah's, Lumin, and 3kh0 all in one place.</p>
            </div>
            <div class="mt-4 sm:mt-0 flex gap-2">
                <button onclick="window.location.href='https://ais-pre-sohh6faiwpdjywb75q5qhk-207654894741.us-west2.run.app'" class="px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-sm font-medium hover:bg-zinc-800 transition-colors flex items-center gap-2">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Sigma G*mes
                </button>
            </div>
        </header>

        <!-- Filters -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="relative flex-1">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500"></i>
                <input type="text" id="searchInput" placeholder="Search 4.5k+ G*mes!" class="w-full bg-zinc-900/80 border border-zinc-800 rounded-lg pl-10 pr-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-600 transition-colors">
            </div>
            <select id="sourceFilter" class="bg-zinc-900/80 border border-zinc-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-zinc-600 transition-colors">
                <option value="all">All Sources</option>
                <option value="gnmath">GN-Math</option>
                <option value="seraph">Seraph</option>
                <option value="noah">Noah's</option>
                <option value="ugs">UGS</option>
                <option value="lumin">Lumin</option>
                <option value="3kh0">3kh0</option>
            </select>
        </div>

        <div id="loading" class="flex flex-col items-center justify-center py-20 text-zinc-500">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-4"></i>
            <p>Fetching g*mes from CDNs...</p>
        </div>

        <!-- Unified Games Grid -->
        <div id="gamesGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
        
        <div id="loadMoreContainer" class="flex justify-center mt-10 hidden">
            <button id="loadMoreBtn" class="px-6 py-3 bg-zinc-900 border border-zinc-700 rounded-lg hover:bg-zinc-800 transition-colors font-medium">Load More</button>
        </div>

        <!-- Lumin Container -->
        <div id="luminSection" class="hidden mt-8 border-t border-zinc-800 pt-8">
            <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-2">
                <i data-lucide="zap" class="text-yellow-500"></i> LuminSDK G*mes
            </h2>
            <div id="lumin-container" class="w-full min-h-[500px]"></div>
        </div>
    </div>

    <!-- Fullscreen Player -->
    <div id="player-overlay" class="fixed inset-0 z-50 bg-black flex-col">
        <div class="flex items-center justify-between px-4 py-3 bg-zinc-900 border-b border-zinc-800">
            <h3 id="player-title" class="text-white font-medium pl-2 truncate flex-1">Loading...</h3>
            <div class="flex items-center gap-2">
                <span id="player-source" class="px-2 py-1 bg-zinc-800 rounded text-xs font-medium text-zinc-400 uppercase tracking-wider mr-2"></span>
                <button onclick="document.getElementById('player-iframe').requestFullscreen()" class="p-2 text-zinc-400 hover:text-white rounded-lg transition-colors popup-btn">
                    <i data-lucide="maximize" class="w-5 h-5"></i>
                </button>
                <button onclick="closePlayer()" class="p-2 text-zinc-400 hover:text-white rounded-lg transition-colors popup-btn">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
        <div class="flex-1 w-full bg-black relative">
            <iframe id="player-iframe" class="w-full h-full border-none bg-black" allow="autoplay; fullscreen; pointer-lock; keyboard-map" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let allGames = [];
        let filteredGames = [];
        let currentRenderCount = 100;

        async function fetchGNMath() {
            try {
                const res = await fetch("https://cdn.jsdelivr.net/gh/freebuisness/assets@latest/zones.json");
                const raw = await res.json();
                const coverBase = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main";
                const htmlBase = "https://rawcdn.githack.com/freebuisness/html/main";
                return raw.slice(1)
                    .filter(z => !z.name.toLowerCase().includes("comment"))
                    .map(z => ({
                    title: z.name,
                    url: z.url.replace("{HTML_URL}", htmlBase),
                    image: z.cover.replace("{COVER_URL}", coverBase),
                    source: 'gnmath'
                }));
            } catch (e) {
                console.error("GN Math error:", e);
                return [];
            }
        }

        async function fetchSeraph() {
            try {
                const res = await fetch('https://api.github.com/repos/a456pur/seraph/git/trees/main?recursive=1');
                const json = await res.json();
                if (!json.tree) return [];
                return json.tree
                    .filter(i => i.path.startsWith('games/') && i.path.endsWith('index.html'))
                    .map(i => {
                        let id = i.path.replace('games/','').split('/')[0];
                        let name = id.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        return {
                            title: name,
                            url: `https://raw.githack.com/a456pur/seraph/main/${i.path}`,
                            image: `https://raw.githubusercontent.com/a456pur/seraph/main/images/thumbnails/${id}.jpg`,
                            source: 'seraph'
                        };
                    });
            } catch(e) {
                console.error("Seraph error", e);
                return [];
            }
        }

        async function fetchNoah() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor/master/games.js');
                const text = await res.text();
                const match = text.match(/const games = (\[.*?\]);/s);
                let fetched = [];
                if (match) {
                    const str = match[1];
                    const regex = /{ title: "(.*?)", desc: "(.*?)", url: "(.*?)", image: "(.*?)" }/g;
                    let m;
                    while ((m = regex.exec(str)) !== null) {
                        fetched.push({
                            title: m[1].replace(/\\"/g, '"'),
                            url: m[3].replace('/refs/heads/master/', '/master/').replace('raw.githubusercontent.com', 'raw.githack.com'),
                            image: m[4],
                            source: 'noah'
                        });
                    }
                }
                return fetched;
            } catch(e) {
                console.error("Noah error", e);
                return [];
            }
        }

        async function fetchUGS() {
            try {
                const res = await fetch("https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js");
                const text = await res.text();
                const match = text.match(/let files = \[(.*?)\];/s);
                let fetched = [];
                if (match) {
                    const stringMatches = [...`[${match[1]}]`.matchAll(/"([^"]+)"|'([^']+)'/g)];
                    fetched = stringMatches.map(m => {
                        let file = m[1] || m[2];
                        let name = file.replace(/^cl/i, '').replace(/([a-z])([A-Z0-9])/g, '$1 $2').replace(/[-_.]/g, ' ').trim();
                        name = name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
                        const normalized = (file.includes(".") && file.lastIndexOf(".") > 0) ? file : file + ".html";
                        return {
                            title: name || file,
                            url: `https://raw.githack.com/bubbls/ugs-singlefile/main/UGS-Files/${encodeURIComponent(normalized)}`,
                            image: null,
                            source: 'ugs'
                        };
                    }).filter(game => game.title !== '?');
                }
                return fetched;
            } catch(e) {
                console.error("UGS error", e);
                return [];
            }
        }

        async function fetch3kh0() {
            try {
                const res = await fetch('https://api.github.com/repos/3kh0/3kh0-lite/git/trees/main?recursive=1');
                const json = await res.json();
                if (!json.tree) return [];
                
                return json.tree
                    .filter(i => i.path.startsWith('projects/') && i.path.split('/').length === 2 && i.type === 'tree')
                    .map(i => {
                        const id = i.path.replace('projects/', '');
                        const name = id.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        
                        const imageNode = json.tree.find(n => 
                            n.path.startsWith(`projects/${id}/`) && 
                            (n.path.endsWith('.png') || n.path.endsWith('.jpg'))
                        );

                        const imagePath = imageNode ? imageNode.path : `projects/${id}/meta/apple-touch-icon.png`;

                        return {
                            title: name,
                            url: `https://raw.githack.com/3kh0/3kh0-lite/main/projects/${id}/index.html`,
                            image: `https://raw.githack.com/3kh0/3kh0-lite/main/${imagePath}`,
                            source: '3kh0'
                        };
                    });
            } catch(e) {
                console.error("3kh0 error", e);
                return [];
            }
        }

        function loadLumin() {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js';
            script.onload = () => {
                if (window.Lumin) {
                    window.Lumin.init({ container: '#lumin-container', theme: 'dark' });
                    // hide random button
                    setInterval(() => {
                        const root = document.querySelector('#lumin-container')?.shadowRoot;
                        if(root) {
                            root.querySelectorAll('button').forEach(b => {
                                if(b.textContent.toLowerCase().includes('random')) b.style.display = 'none';
                            });
                        }
                    }, 500);
                }
            };
            document.body.appendChild(script);
        }

        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            
            const toRender = filteredGames.slice(0, currentRenderCount);
            
            toRender.forEach(g => {
                const div = document.createElement('div');
                div.className = "group relative aspect-square glow-border bg-zinc-900 rounded-xl overflow-hidden cursor-pointer flex flex-col items-center justify-center text-center";
                div.onclick = () => openPlayer(g);
                
                let sourceColor = "text-zinc-500";
                if(g.source === 'gnmath') sourceColor = "text-red-500";
                if(g.source === 'seraph') sourceColor = "text-purple-500";
                if(g.source === 'noah') sourceColor = "text-orange-500";
                if(g.source === 'ugs') sourceColor = "text-blue-500";
                if(g.source === '3kh0') sourceColor = "text-yellow-500";

                if (g.image) {
                    div.innerHTML = `
                        <img src="${g.image}" alt="${g.title}" loading="lazy" class="card-img" onerror="this.style.display='none'">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent pointer-events-none"></div>
                        <div class="absolute inset-x-0 bottom-0 p-3 pointer-events-none">
                            <p class="text-white font-medium text-sm leading-tight truncate drop-shadow-md">${g.title}</p>
                            <span class="${sourceColor} text-[10px] font-bold uppercase tracking-wider">${g.source}</span>
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="p-4 flex flex-col items-center justify-center gap-2">
                            <p class="text-white font-medium break-words shrink-0 line-clamp-3 leading-tight">${g.title}</p>
                            <span class="${sourceColor} text-[10px] font-bold uppercase tracking-wider">${g.source}</span>
                        </div>
                    `;
                }
                grid.appendChild(div);
            });

            const loadMoreBtn = document.getElementById('loadMoreContainer');
            if (currentRenderCount < filteredGames.length) {
                loadMoreBtn.classList.remove('hidden');
                document.getElementById('loadMoreBtn').innerText = `Load More (${filteredGames.length - currentRenderCount} left)`;
            } else {
                loadMoreBtn.classList.add('hidden');
            }
            
            if(filteredGames.length === 0) {
               grid.innerHTML = `<div class="col-span-full py-20 text-zinc-500 text-center">No g*mes found.</div>`;
            }
        }

        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const source = document.getElementById('sourceFilter').value;
            
            const luminSec = document.getElementById('luminSection');
            const gridSec = document.getElementById('gamesGrid');
            const loadMoreSec = document.getElementById('loadMoreContainer');

            if (source === 'lumin') {
                luminSec.classList.remove('hidden');
                gridSec.classList.add('hidden');
                loadMoreSec.classList.add('hidden');
                filteredGames = [];
            } else {
                luminSec.classList.add('hidden');
                gridSec.classList.remove('hidden');
                
                filteredGames = allGames.filter(g => {
                    const matchQ = g.title.toLowerCase().includes(query) || (g.url && g.url.toLowerCase().includes(query));
                    const matchS = source === 'all' ? true : g.source === source;
                    return matchQ && matchS;
                });
                currentRenderCount = 100;
                renderGames();
            }
        }

        document.getElementById('searchInput').addEventListener('input', filterGames);
        document.getElementById('sourceFilter').addEventListener('change', filterGames);
        document.getElementById('loadMoreBtn').addEventListener('click', () => {
            currentRenderCount += 100;
            renderGames();
        });

        function openPlayer(game) {
            document.getElementById('player-title').innerText = game.title;
            document.getElementById('player-source').innerText = game.source;
            document.getElementById('player-iframe').src = game.url;
            document.getElementById('player-overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function closePlayer() {
            document.getElementById('player-iframe').src = '';
            document.getElementById('player-overlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        async function init() {
            const [gn, seraph, noah, ugs, threekh0] = await Promise.all([
                fetchGNMath(), fetchSeraph(), fetchNoah(), fetchUGS(), fetch3kh0()
            ]);
            allGames = [...gn, ...seraph, ...noah, ...ugs, ...threekh0];
            
            // Sort array alphabetically by title
            allGames.sort((a, b) => {
                const titleA = a.title ? a.title.toLowerCase() : '';
                const titleB = b.title ? b.title.toLowerCase() : '';
                return titleA.localeCompare(titleB);
            });
            
            document.getElementById('loading').style.display = 'none';
            filterGames();
            loadLumin();
        }

        init();
    </script>
</body>
</html>
