<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma G*mes Static</title>
    <link rel="icon" type="image/svg+xml" href="https://sigma-sigma-rizz.vercel.app/favicon.svg" />
</head>
<body style="background:#09090b;color:#d4d4d8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:system-ui, -apple-system, sans-serif;">
    <div id="loader" style="text-align:center;">
        <div style="border:3px solid rgba(255,255,255,0.1);border-left-color:#f43f5e;border-radius:50%;width:36px;height:36px;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>
        <p style="margin:0;font-size:14px;color:#a1a1aa;letter-spacing:0.05em;text-transform:uppercase;font-weight:500;">Loading Sigma G*mes Static...</p>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script>
        (async () => {
            try {
                const res = await fetch("https://cdn.jsdelivr.net/gh/deeeland0ohio/Sigma-Games@main/public/static-stuff.html");
                if (!res.ok) throw new Error("Failed to load CDN asset: " + res.status);
                const html = await res.text();
                document.open();
                document.write(html);
                document.close();
            } catch (e) {
                console.error("Error loading CDN:", e);
                document.getElementById('loader').innerHTML = '<p style="color:#ef4444;font-weight:500;">Failed to load. Please try refreshing.</p>';
            }
        })();
    </script>
</body>
</html>
