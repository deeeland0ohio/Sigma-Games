<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Drift Boss</title>
    <link href="https://cdn.jsdelivr.net/gh/bubbls/ruffle@87ee8bdf0c0a91c39f0fc9375993f5498be7411e/games.css" rel="stylesheet" type="text/css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #ajaxbar {
            width: 100% !important;
            height: 100% !important;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        #game, #webgl {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        #orientate, #play {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        #play {
            pointer-events: auto;
            cursor: pointer;
        }
    </style>
</head>
<body dir="ltr">
    <div id="ajaxbar">
        <div id="game" style="z-index: 1;">
            <canvas id="canvas"></canvas>
        </div>
        <div id="webgl" style="z-index: 0;">
            <canvas id="webglcanvas" touch-action="none"></canvas>
        </div>
        <div id="orientate"></div>
        <div class="play" id="play"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@58de31cc1b4f910a995662c4a2124bc456d46c8b/bossgame.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/gh/st39/sdk@main/api.js"></script>
</body>
</html>
