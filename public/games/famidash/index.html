<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>FamiDash</title>
	<style>
		body {
			overflow: hidden;
			background: #000000;
			margin: 0;
			padding: 0;
			color: #000000;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100vw;
			height: 100vh;
		}

		#startButton {
			display: block;
			width: 160px;
			height: 40px;
			background-color: #4CAF50;
			color: white;
			text-align: center;
			text-decoration: none;
			font-size: 16px;
			padding: 10px 20px;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			font-family: 'Press Start 2P', cursive;
			box-shadow: 0px 0px 10px 2px #000000;
		}

		#game {
			width: 100%;
			height: 100%;
		}
	</style>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
</head>

<body>
	<div style="width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;">
		<div id="game" style="display: none;"></div>
		<button id="startButton">PLAY</button>
	</div>
	<script>
		document.getElementById("game").style.display = "none";
		function startGame() {
			document.getElementById("game").style.display = "block";
			document.getElementById("startButton").style.display = "none";
			window.EJS_player = "#game";
			window.EJS_core = "fceumm";
			window.EJS_color = "#000000";
			window.EJS_startOnLoaded = true;
			window.EJS_pathtodata = "https://cdn.jsdelivr.net/gh/linuxguist/emulatorjs@0.5.4/data/";
			window.EJS_gameUrl = "https://cdn.jsdelivr.net/gh/schoolstuff1337/supplies@main/nes/famidash1.2.8/Famidash.v1.2.8.nes";
			window.EJS_gameID = "famidash-v128-final-" + Date.now();
			loadGame();
		}
		document.getElementById("startButton").addEventListener("click", startGame);
		function loadGame() {
			var script = document.createElement("script");
			script.src = "https://cdn.jsdelivr.net/gh/linuxguist/emulatorjs@0.5.4/data/loader.js";
			document.body.appendChild(script);
		}
	</script>
</body>
</html>
