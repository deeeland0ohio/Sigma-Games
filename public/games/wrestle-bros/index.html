<!DOCTYPE html>
<html lang="en">
<head>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@0e4ecd6d318272b62cd671011d5afe60aec66321/wrestle%20bros/">
  <meta charset="utf-8">
  <title>Wrestle Bros</title>
  <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="shortcut icon" type="image/png" href="./favicon.png">

  <script type="text/javascript" src="WrestleBros.js?th=676"></script>

  <script>
    window.addEventListener("touchmove", function(event) {
      event.preventDefault();
    }, {
      capture: false,
      passive: false
    });
    if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
      var meta = document.getElementById("viewport");
      meta.setAttribute('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
    }
    window.addEventListener('keydown', function(e) {
      if ((e.keyCode == 32 || e.keyCode == 38 || e.keyCode == 40) && e.target == document.body) {
        e.preventDefault();
      }
    });
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000000;
      color: orange;
      width: 100vw;
      overflow: hidden;
    }

    #openfl-content {
      background: #000000;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="loading" style="position: absolute; z-index: 15; top: 60%; left: 50%; transform: translate(-50%, 0); background: black;">
    <center><img src="assets/loading4.png"><br />
      <img src="assets/fbro.png">
      <img src="assets/sbro.png">
      <img src="assets/wbro.png">
      <img src="assets/bbro.png">
    </center>
  </div>

  <div id="game2" style="width: 100%; height: 100%;">
    <div id="openfl-content" onblur="window.focus();" style="width: 100%; height: 100%;">
      <script type="text/javascript">
        lime.embed("WrestleBros", "openfl-content", 0, 0, {
          parameters: {}
        });
      </script>
    </div>
  </div>

  <script>
    // Stubs for ads and tracking to prevent game freezes
    window.ShowAdBreak = function() { setTimeout(function() { if(typeof window.Main !== 'undefined' && window.Main.DoneInterstitialAd) window.Main.DoneInterstitialAd(false); }, 100); }
    window.ShowVideo = function() { setTimeout(function() { if(typeof window.Main !== 'undefined' && window.Main.DoneVideoAd) window.Main.DoneVideoAd(); }, 100); }
    window.adplayer = {};
    window.ShowAd1 = function() {}; window.ShowAd2 = function() {}; window.ShowAd3 = function() {}; window.ShowAd4 = function() {};
    window.ShowAd6 = function() {}; window.ShowAd7 = function() {}; window.ShowAd8 = function() {}; window.ShowAd9 = function() {};
    window.SendEvent = function() {};
    window.GamePlayStart = function() {}
    window.GamePlayStop = function() {}
    window.HappyTime = function() {}
  </script>
</body>
</html>
