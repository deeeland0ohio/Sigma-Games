<!doctype html>
<html><head>
    <title>Ice Dodo</title>
    <base href="https://cdn.jsdelivr.net/gh/genizy/ice-dodo/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/libs/jquery-3.3.1.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/libs/three.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/libs/stats.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/libs/dat.gui.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/libs/OrbitControls.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/libs/Detector.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/libs/perlin.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/libs/seedrandom.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/libs/Tween.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/src/MapData.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/src/MapManager.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/src/Block.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/src/Player.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/src/Particle.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/src/Game.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/genizy/ice-dodo@b950830c255518c930fbc2a0bd3182e7d4cc920c/style.css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,800,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700,800" rel="stylesheet">
</head>
<body>
<div id="WebGL-output">
</div>
<div id="mainMenu" class="menu" style="display: none;">
    <div id="titleContainer">
        <div id="title">ICE DODO</div>
    </div>
    <div id="playButton" class="button">PLAY</div>
    <div id="levelSelectButton" class="button">LEVELS</div>
    <div id="optionsButton" class="button">OPTIONS</div>
    <div id="creditsButton" class="button">CREDITS</div>
</div>
<div id="levelSelectMenu" class="menu" style="display: none;">
    <div id="levelSelectTitle" class="title">LEVELS</div>
    <div id="levelList"></div>
    <div id="backButtonLevelSelect" class="button backButton">BACK</div>
</div>
<div id="optionsMenu" class="menu" style="display: none;">
    <div id="optionsTitle" class="title">OPTIONS</div>
    <div class="optionRow">
        <span class="optionLabel">Music</span>
        <div id="musicToggle" class="toggleButton">ON</div>
    </div>
    <div class="optionRow">
        <span class="optionLabel">Sound</span>
        <div id="soundToggle" class="toggleButton">ON</div>
    </div>
    <div class="optionRow">
        <span class="optionLabel">Quality</span>
        <div id="qualityToggle" class="toggleButton">HIGH</div>
    </div>
    <div id="backButtonOptions" class="button backButton">BACK</div>
</div>
<div id="creditsMenu" class="menu" style="display: none;">
    <div id="creditsTitle" class="title">CREDITS</div>
    <div id="creditsContent">
        <p>Created by Seojoon Yeon</p>
    </div>
    <div id="backButtonCredits" class="button backButton">BACK</div>
</div>
<div id="gameUI" style="display: block;">
    <div id="levelDisplay">Level 1</div>
    <div id="scoreDisplay">Score: 0</div>
    <div id="pauseButton" class="button smallButton">PAUSE</div>
</div>
<div id="pauseMenu" class="menu" style="display: none;">
    <div id="pauseTitle" class="title">PAUSED</div>
    <div id="resumeButton" class="button">RESUME</div>
    <div id="restartButton" class="button">RESTART</div>
    <div id="quitButton" class="button">QUIT</div>
</div>
<div id="gameOverMenu" class="menu" style="display: none;">
    <div id="gameOverTitle" class="title">GAME OVER</div>
    <div id="finalScoreDisplay">Score: 0</div>
    <div id="retryButton" class="button">RETRY</div>
    <div id="mainMenuButton" class="button">MAIN MENU</div>
</div>
<div id="levelCompleteMenu" class="menu" style="display: none;">
    <div id="levelCompleteTitle" class="title">LEVEL COMPLETE</div>
    <div id="levelScoreDisplay">Score: 0</div>
    <div id="nextLevelButton" class="button">NEXT LEVEL</div>
    <div id="mainMenuButtonComplete" class="button">MAIN MENU</div>
</div>
<script type="text/javascript">
    $(function () {
        var game = new Game();
        game.init();
    });
</script>
</body></html>
