<!DOCTYPE html>
<html lang="en">
    <head>
        <base href="https://cdn.jsdelivr.net/gh/genizy/assets@main/basketball-stars/">
        <meta charset="utf-8" />
        <meta http-equiv="x-ua-compatible" content="ie=edge" />
        <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
        <link rel="stylesheet" href="assets/css/app.css" type="text/css" />
        <title>Basketball Stars</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <style>
          html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
          }
        </style>
    </head>
    <body>
        <div id="content"></div>
        <div id="orientation"></div>
        <div id="loader">Loading ...</div>
        
        <script type="text/javascript" src="assets/box2dweb/nape.min.js">
            var nape ="nape.min.js" ;
        </script>
        <script type="text/javascript" src="assets/box2dweb/nape-debug-draw.min.js"></script>
        <script type="text/javascript" src="assets/box2dweb/jquery-3.1.1.min.js"></script>
        <script type="text/javascript" src="assets/box2dweb/easeljs-0.8.2.combined.js"></script>
        <script type="text/javascript" src="assets/box2dweb/bluebird.min.js"></script>
        <script type="text/javascript">
            var useEvents = typeof Event === "function";

            var myDispatchEvent = function (name) {
                var event;
                if (useEvents) {
                    event = new Event(name);
                } else {
                    event = document.createEvent("Event");
                    event.initEvent(name, true, true);
                }
                document.getElementById("content").dispatchEvent(event);
            };

            window["GD_OPTIONS"] = {
                gameId: "69d78d071f704fa183d75b4114ae40ec",
                onEvent: function (event) {
                    switch (event.name) {
                        case "SDK_GAME_START":
                            myDispatchEvent("SDK_GAME_START");
                            break;
                        case "SDK_GAME_PAUSE":
                            myDispatchEvent("SDK_GAME_PAUSE");
                            break;
                        case "SDK_READY":
                            console.log("SDK_READY");
                            break;
                    }
                },
            };
            
            // Robust stub for GameDistribution SDK to prevent ads and hangs
            window.gdsdk = {
                showAd: function() {
                    console.log("Ad requested, skipping...");
                    setTimeout(function() {
                        myDispatchEvent("SDK_GAME_START");
                    }, 100);
                    return Promise.resolve();
                },
                showBanner: function() {
                    return Promise.resolve();
                },
                preloadAd: function() {
                    return Promise.resolve();
                },
                openConsole: function() {}
            };

            // Stub google.ima to prevent errors if the game looks for it
            window.google = {
                ima: {
                    disableCustomPlaybackForIOS10Plus: function() {},
                    settings: { setDisableCustomPlaybackForIOS10Plus: function() {} }
                }
            };

            // Some games wait for an initial ad to finish before showing the main menu
            setTimeout(function() {
                myDispatchEvent("SDK_GAME_START");
            }, 1000);
            setTimeout(function() {
                myDispatchEvent("SDK_GAME_START");
            }, 3000);
        </script>
        <script type="text/javascript" src="assets/basketball_legends_2019.min.js"></script>
    </body>
</html>
