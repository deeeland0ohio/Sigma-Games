<!DOCTYPE html>
<html>
<head>
  <base href="https://cdn.jsdelivr.net/gh/Katsugachi/deltarune@main/">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="logo-container">
    <img src="logo.png" alt="Logo" class="logo">
  </div>
  
  <div class="menu">
    <a href="javascript:loadChapter(1)" class="row">
      <span class="chapter">Chapter 1</span>
      <span class="title">The Beginning</span>
      <img src="icons/1.png">
    </a>
    <a href="javascript:loadChapter(2)" class="row">
      <span class="chapter">Chapter 2</span>
      <span class="title">A Cyber's World</span>
      <img src="icons/2.png">
    </a>
    <a href="javascript:loadChapter(3)" class="row">
      <span class="chapter">Chapter 3</span>
      <span class="title">Late Night</span>
      <img src="icons/3.png">
    </a>
    <a href="javascript:loadChapter(4)" class="row">
      <span class="chapter">Chapter 4</span>
      <span class="title">Prophecy</span>
      <img src="icons/4.png">
    </a>
    <a href="javascript:loadChapter(5)" class="row">
      <span class="chapter">Chapter 5</span>
      <span class="title">Festival Day</span>
      <img src="icons/5.png">
    </a>
  </div>
  <audio id="drone" controls loop autoplay hidden>
    <source src="audios/AUDIO_DRONE.ogg" type="audio/ogg">
    your slow ass browser doesnt support AUDIO?
  </audio>
  <button id="mute">🔊</button>
  <script>
    const audio = document.getElementById('drone');
    const mute = document.getElementById('mute');
    let gamestarted = false;
  
    mute.addEventListener('click', () => {
      if (!gamestarted) {
        audio.muted = !audio.muted;
        updateButton(); 
      }
    });
  
    function updateButton() {
      if (!gamestarted) {
        mute.textContent = audio.muted ? '🔊' : '🔇';
      }
    }
  
    updateButton();

    function loadChapter(chapter) {
      fetch(`chapter${chapter}/index.html`)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          return res.text();
        })
        .then(html => {
          gamestarted = true;
          
          let targetBase = '';
          if (chapter >= 1 && chapter <= 4) {
            targetBase = `https://cdn.jsdelivr.net/gh/technonyte00/deltarune@main/chapter${chapter}/`;
          } else if (chapter === 5) {
            targetBase = `https://cdn.jsdelivr.net/gh/Katsugachi/deltarune@main/chapter5/`;
          }
          
          if (targetBase) {
            if (/<base\s+href="[^"]*"/gi.test(html)) {
              html = html.replace(/<base\s+href="[^"]*"/gi, `<base href="${targetBase}"`);
            } else {
              if (/<head>/i.test(html)) {
                html = html.replace(/<head>/i, `<head>\n  <base href="${targetBase}">`);
              } else {
                html = `<base href="${targetBase}">\n` + html;
              }
            }
          }

          document.open();
          document.write(html);
          document.close();
        })
        .catch(err => {
          console.error("Error loading chapter:", err);
          alert(`Failed to load Chapter ${chapter}. Please try again.`);
        });
    }

    const menumoveaudio = new Audio('audios/snd_menumove.mp3');
    const menuselectaudio = new Audio('audios/snd_select.mp3');
    document.querySelectorAll('.row').forEach(row => {
      row.addEventListener('mouseenter', () => {
        if (!gamestarted) {
          menumoveaudio.play().catch(e => console.log('Playback prevented:', e));
          if (selectedChapter !== null) {
            document.querySelectorAll('.row')[selectedChapter].classList.remove("selected");
          }
        }
      });
      row.addEventListener('click', () => {
        if (!gamestarted) {
          menuselectaudio.play().catch(e => console.log('Playback prevented:', e));
        }
      });
    });

    let selectedChapter = null;
    document.addEventListener('keydown', function(event) {
      if (!gamestarted) {
      if (event.key === 'ArrowUp') {
        if (selectedChapter === null) {
          selectedChapter = 0;
          document.querySelectorAll('.row')[0].classList.add("selected");
          menumoveaudio.play().catch(e => console.log('Playback prevented:', e));
        } else {
          document.querySelectorAll('.row')[selectedChapter].classList.remove("selected");
          selectedChapter--;
          if (selectedChapter < 0) {
            selectedChapter = document.querySelectorAll('.row').length - 1;
          }
          document.querySelectorAll('.row')[selectedChapter].classList.add("selected");
          menumoveaudio.play().catch(e => console.log('Playback prevented:', e));
        }
      } else if (event.key === 'ArrowDown') {
        if (selectedChapter === null) {
          selectedChapter = 0;
          document.querySelectorAll('.row')[0].classList.add("selected");
          menumoveaudio.play().catch(e => console.log('Playback prevented:', e));
        } else {
          if (selectedChapter+1 >= document.querySelectorAll('.row').length) {
            document.querySelectorAll('.row')[selectedChapter].classList.remove("selected");
            selectedChapter = 0;
            document.querySelectorAll('.row')[0].classList.add("selected");
            menumoveaudio.play().catch(e => console.log('Playback prevented:', e));
          } else {
            document.querySelectorAll('.row')[selectedChapter].classList.remove("selected");
            selectedChapter++;
            document.querySelectorAll('.row')[selectedChapter].classList.add("selected");
            menumoveaudio.play().catch(e => console.log('Playback prevented:', e));
          }
        }
      } else if (event.key === 'Enter') {
        if (selectedChapter !== null) {
          menuselectaudio.play().catch(e => console.log('Playback prevented:', e));
          loadChapter(selectedChapter + 1);
        } 
      }
      }
    });
  </script>
</body>
</html>
