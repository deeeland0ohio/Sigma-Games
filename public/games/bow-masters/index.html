<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui"/>
    <title>Bowmasters</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #game {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
    </style>

    <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/bowmasters/">
    <link rel="stylesheet" type="text/css" href="style/index.css" />

    <script>
        // Mock YouTube Playables SDK
        window.ytgame = {
            game: {
                firstClick: () => {},
                gameReady: () => { console.log("Game Ready called"); },
                loadProgress: () => {},
                onPause: (cb) => {},
                onResume: (cb) => {},
                onAudioMute: (cb) => {},
                onAudioUnmute: (cb) => {},
                sendScore: () => {},
                getLanguage: () => 'en',
                getCloudStorage: () => Promise.resolve({}),
                setCloudStorage: () => Promise.resolve()
            },
            system: {
                onVisibilityChange: (cb) => {},
                onOrientationChange: (cb) => {}
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/ytgame.js"></script>
    <script src="game.js"></script>
    <script>
        window.addEventListener("load", () => {
            console.log("Page loaded, initializing game...");
            if (window.ytgame && window.ytgame.game && window.ytgame.game.gameReady) {
                window.ytgame.game.gameReady();
            }
            if (window.runGame) {
                window.runGame();
            } else {
                console.error("runGame function not found in game.js");
            }
        });
    </script>
</head>


<body>
    <div id="game"></div>
</body>
</html>
