<!DOCTYPE html>

<head>

    <script>
        window.addEventListener("touchmove", function(event) { event.preventDefault(); }, { capture: false, passive: false });
        if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
            var meta = document.getElementById("viewport");
            meta.setAttribute('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
        }
        window.addEventListener('keydown', function(e) {
            if ((e.keyCode == 32 || e.keyCode == 38 || e.keyCode == 40 || e.keyCode == 9) && e.target == document.body) {
                e.preventDefault();
            }
        });
        var aCo = 'US';
    </script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #000000; overflow: hidden; }
        #openfl-content { background: #000000; width: 100%; height: 100%; }
    </style>
    <script>
        // Mock Firebase with localStorage to remove external tracking
        var userData = localStorage.getItem('baseballBrosData') || "";

        function triggerSignIn() {
            // Mock sign in
            setTimeout(() => {
                if (typeof Main != "undefined") Main.LoadDataComplete();
            }, 100);
        }
        function saveGameData(gameData) {
            userData = gameData;
            localStorage.setItem('baseballBrosData', gameData);
        }
        function loadGameData() { return userData; }
        function loadGameDataAsync() {
            var data = localStorage.getItem('baseballBrosData');
            if (data) {
                userData = data;
                if (typeof Main != "undefined") { Main.LoadDataComplete(); }
            } else {
                userData = "";
            }
        }
        function signOut() {
            if (typeof Main != "undefined") Main.SignOutComplete();
        }
        function isUserLoggedIn() { return true; } // Always logged in for local saves
        function SendEvent(type, eventName) { console.log("Event:", type, eventName); }
        function updateStatus() {}
        function EmailSignup() {}
        function SetCGInviteLink() {}
        function LoadVideo() {}
        function SetupMSNotification() {}
        function right(str, chr) { return str.slice(str.length - chr, str.length); }
        function refreshTag(theTag) {}
        
        var scrollerMessage = "   ";
        var lastRefresh = 0;
        var lastRefresh6 = 0;
        var doTagOnce = true;
        var lastRefresh2 = 0;
        var sid = 'mock_sid';

        // Auto load on start
        setTimeout(() => {
            loadGameDataAsync();
        }, 500);
    </script>
</head>

    <script>
        // Stub WebRTC to prevent crashes if it's not supported or blocked
        window.RTCPeerConnection = window.RTCPeerConnection || function() {
            console.warn("RTCPeerConnection stubbed");
            return {
                createDataChannel: function() { return { send: function() {}, close: function() {} }; },
                createOffer: function() { return Promise.resolve({}); },
                setLocalDescription: function() { return Promise.resolve(); },
                setRemoteDescription: function() { return Promise.resolve(); },
                addIceCandidate: function() { return Promise.resolve(); },
                onicecandidate: null,
                oniceconnectionstatechange: null,
                ondatachannel: null
            };
        };
        window.RTCSessionDescription = window.RTCSessionDescription || function() {};
        window.RTCIceCandidate = window.RTCIceCandidate || function() {};
        
        // Global error handling to prevent game freezes
        window.onerror = function(msg, url, line, col, error) {
            console.error("GAME ERROR:", msg, "at", url, ":", line, ":", col);
            if (error) console.error(error);
            // If the game crashes, we try to force a resume if it's ad-related
            if (msg && (msg.indexOf('ad') !== -1 || msg.indexOf('Ads') !== -1)) {
                try { window.ShowAdBreak(); } catch(e) {}
            }
            return true; 
        };
        window.onunhandledrejection = function(event) {
            console.warn("Unhandled promise rejection:", event.reason);
        };

        // Mock ad functions to prevent game from hanging
        window.ShowAd1 = window.ShowAd2 = window.ShowAd3 = window.ShowAd4 = window.ShowAd6 = window.ShowAd7 = window.ShowAd8 = window.ShowAd9 = function() {};
        window.ShowVideo = function() { 
            console.log("Video ad requested");
            setTimeout(function() {
                try {
                    if (typeof Main !== 'undefined') Main.DoneVideoAd(true);
                } catch(e) { console.error("Error in DoneVideoAd:", e); }
            }, 500);
        };
        window.ShowAdBreak = function() { 
            console.log("Ad break requested");
            setTimeout(function() {
                try {
                    if (typeof Main !== 'undefined') Main.DoneInterstitialAd(true);
                } catch(e) { console.error("Error in DoneInterstitialAd:", e); }
            }, 500);
        };
        window.GamePlayStart = function() {};
        window.GamePlayStop = function() {};
        window.HappyTime = function() {};
        
        window.SetCGInviteLink = function(link) { 
            console.log("Invite link generated:", link);
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(link).catch(e => console.warn("Clipboard write failed:", e));
                }
            } catch(e) {}
        };
        
        // Prevent crashes from missing common globals
        window.cpmstar = window.cpmstar || {};
        window.googletag = window.googletag || { cmd: [], display: function() {}, pubads: function() { return { enableSingleRequest: function() {}, collapseEmptyDivs: function() {} }; }, enableServices: function() {} };
        
        // Stub window.open to prevent iframe security errors
        const originalOpen = window.open;
        window.open = function(url, target, features) {
            console.log("Window.open called with:", url);
            if (!url) return null;
            return { close: function() {}, focus: function() {} };
        };
    </script>
</body>
