<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<title>Unity WebGL Player | Granny 3</title>
<link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/ranny31ranny/5471@main/TemplateData/favicon.ico"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ranny31ranny/5471@main/TemplateData/style.css"/>
</head>
<body>
<div id="unity-container" style="position: absolute; width: 100%; height: 100%; left: 0%; top: 0%;">
<canvas id="unity-canvas" style="position: absolute; width: 100%; height: 100%"></canvas>
<div id="unity-loading-bar">
<div id="unity-logo"></div>
<div id="unity-progress-bar-empty">
<div id="unity-progress-bar-full"></div>
</div>
</div>
<div id="unity-warning"> </div>
</div>
<script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "https://cdn.jsdelivr.net/gh/ranny31ranny/5471@main/Build";
      var loaderUrl = buildUrl + "/bb0d9ecdb05db3e84da20bd14a4f84dc.loader.js";

      function mergeFiles(fileParts) {
        console.log("Starting merge for:", fileParts);
        return new Promise((resolve, reject) => {
            let buffers = [];
            function fetchPart(index) {
                if (index >= fileParts.length) {
                    let mergedBlob = new Blob(buffers);
                    let mergedFileUrl = URL.createObjectURL(mergedBlob);
                    console.log("Merge complete for:", fileParts, "URL:", mergedFileUrl);
                    resolve(mergedFileUrl);
                    return;
                }
                console.log("Fetching part:", fileParts[index]);
                fetch(fileParts[index])
                    .then(response => {
                        if (!response.ok) throw new Error("Failed to fetch " + fileParts[index]);
                        return response.arrayBuffer();
                    })
                    .then(data => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    })
                    .catch(error => {
                        console.error("Fetch error:", error);
                        reject(error);
                    });
            }
            fetchPart(0);
        });
      }

      var wasmParts = [
          buildUrl + "/bd8d511ba06d09159c93b032551b04fb.wasm.part0",
          buildUrl + "/bd8d511ba06d09159c93b032551b04fb.wasm.part1",
          buildUrl + "/bd8d511ba06d09159c93b032551b04fb.wasm.part2"
      ];

      var dataParts = [
          buildUrl + "/fef8fdd7cfc9e5a5001034b01fa3647b.data.part0",
          buildUrl + "/fef8fdd7cfc9e5a5001034b01fa3647b.data.part1"
      ];

      console.log("Initiating Promise.all for mergeFiles");
      Promise.all([
          mergeFiles(wasmParts),
          mergeFiles(dataParts)
      ]).then(([wasmUrl, dataUrl]) => {
          console.log("MergeFiles Promise.all resolved. wasmUrl:", wasmUrl, "dataUrl:", dataUrl);
          var config = {
              dataUrl: dataUrl,
              frameworkUrl: buildUrl + "/e12dac5a3f5e3f677b009118afef20b7.framework.js",
              codeUrl: wasmUrl,
              streamingAssetsUrl: "StreamingAssets",
              companyName: "Games Place",
              productName: "Granny 3",
              productVersion: "0.1",
              showBanner: unityShowBanner,
          };

          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
              var meta = document.createElement('meta');
              meta.name = 'viewport';
              meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
              document.getElementsByTagName('head')[0].appendChild(meta);
              container.className = "unity-mobile";
              canvas.className = "unity-mobile";
          } else {
              canvas.style.width = "100%";
              canvas.style.height = "100%";
          }

          loadingBar.style.display = "block";
          
          window.myGameInstance = null;

          var script = document.createElement("script");
          script.src = loaderUrl;
          console.log("Loading Unity loader script:", loaderUrl);
          script.onload = () => {
            console.log("Unity loader script loaded.");
            createUnityInstance(canvas, config, (progress) => {
              console.log("Unity loading progress:", progress);
              progressBarFull.style.width = 100 * progress + "%";
                  }).then((unityInstance) => {
                    console.log("Unity instance created successfully.");
                    window.myGameInstance = unityInstance;
                    loadingBar.style.display = "none";
                  }).catch((message) => {
                    console.error("Unity yükleme hatası:", message);
                    alert("Unity yükleme hatası: " + message);
                  });
                };
          script.onerror = () => {
            console.error("Failed to load Unity loader script.");
            alert("Failed to load Unity loader script.");
          };

          document.body.appendChild(script);
      }).catch(error => {
          console.error("Dosya birleştirme hatası:", error);
          alert("Dosya birleştirme hatası: " + error);
      });
</script>
</body>
</html>
