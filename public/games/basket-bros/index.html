<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/genizy/assets@main/basketbros-io/">
    <meta charset="utf-8" />
    <title>Basket Bros</title>
    <meta name="description" content="Online multiplayer basketball! Dunk all over your bros!" />
    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="shortcut icon" type="image/png" href="./favicon.png" />
    <script type="text/javascript" src="./BasketBros.js?th=448"></script>
    <script>
      window.addEventListener(
        "touchmove",
        function (event) {
          event.preventDefault();
        },
        { capture: false, passive: false }
      );
      if (typeof window.devicePixelRatio != "undefined" && window.devicePixelRatio > 2) {
        var meta = document.getElementById("viewport");
        meta.setAttribute("content", "width=device-width, initial-scale=" + 2 / window.devicePixelRatio + ", user-scalable=no");
      }
      window.addEventListener("keydown", function (e) {
        if ((e.keyCode == 32 || e.keyCode == 38 || e.keyCode == 40) && e.target == document.body) {
          e.preventDefault();
        }
      });
    </script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000000;
        color: orange;
        height: 100%;
        width: 100%;
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
      }
      .body::-webkit-scrollbar {
        /* WebKit */
        width: 0px;
      }
      #openfl-content {
        background: #000000;
        width: 100%;
        height: 100%;
      }
      #spinner {
        -webkit-transform-origin: 50% 50%;
        -moz-transform-origin: 50% 50%;
        -o-transform-origin: 50% 50%;
        transform-origin: 50% 50%;
        width: 82px;
        height: 81px;
        -webkit-animation: spin1 2s infinite linear;
        -moz-animation: spin1 2s infinite linear;
        -o-animation: spin1 2s infinite linear;
        -ms-animation: spin1 2s infinite linear;
        animation: spin1 2s infinite linear;
      }
    </style>

    <script>
      // Stub out ad functions so the game doesn't freeze waiting for them
      window.ShowVideo = function() {
        if (window.Main && window.Main.DoneVideoAd) {
          window.Main.DoneVideoAd(true);
        }
      };
      window.ShowAdBreak = function() {
        if (window.Main && window.Main.DoneInterstitialAd) {
          window.Main.DoneInterstitialAd(true);
        }
      };
      window.ShowAd1 = function() {};
      window.ShowAd2 = function() {};
      window.ShowAd3 = function() {};
      window.ShowAd4 = function() {};
      window.ShowAd6 = function() {};
      window.ShowAd7 = function() {};
      window.SetCGInviteLink = function() {};
      window.SendEvent = function() {};
      window.updateStatus = function() {};
    </script>
  </head>
  <body style="overflow: hidden;">
    <noscript>Enable JavaScript bro!</noscript>
    <div id="loading" style="position: absolute; width: 392px; height: 31px; z-index: 15; top: 50%; left: 50%; margin: 100px 0 0 -200px; background: black;">
      <img src="assets/loading.png" />
    </div>

    <div id="game2" style="width: 100%; height: 100%;">
      <div id="openfl-content" style="width: 100%; height: 100%; float: left;">
        <script type="text/javascript">
          lime.embed("BasketBros", "openfl-content", 0, 0, { parameters: {} });
        </script>
      </div>
    </div>
  </body>
</html>
